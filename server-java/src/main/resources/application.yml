server:
  port: 3001

spring:
  application:
    name: insight-server

  datasource:
    url: jdbc:mysql://localhost:3307/voc_insight?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        # 消费者并发：控制 AI 调用速率，避免打爆 LLM 配额
        concurrency: 2
        max-concurrency: 8
        prefetch: 5
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 5s

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
  mapper-locations: classpath*:/mapper/**/*.xml

# 业务配置
voc:
  security:
    # JWT 签名密钥（HS256 要求 >= 32 字节），生产务必用环境变量覆盖
    jwt-secret: ${JWT_SECRET:voc-insight-dev-secret-key-2026-please-change-in-prod}
    # 普通用户 token 有效期（小时）
    jwt-expiration-hours: ${JWT_EXPIRATION_HOURS:8}
    # 服务账号（csat-service）token 有效期（天）
    service-token-expiration-days: ${SERVICE_TOKEN_DAYS:365}
    # 种子账号初始密码（仅首次启动创建，上线后请改密）
    seed-admin-password: ${SEED_ADMIN_PASSWORD:admin123}
    seed-viewer-password: ${SEED_VIEWER_PASSWORD:viewer123}
    seed-service-password: ${SEED_SERVICE_PASSWORD:csat-service-2026}
  openrouter:
    base-url: https://openrouter.ai/api/v1
    api-key: ${OPENROUTER_API_KEY:}
    model: ${AI_MODEL:deepseek/deepseek-v3.2}
  notify-email: ${NOTIFY_EMAIL:}
  insight:
    # Spring @Scheduled cron 为 6 位（含秒）：日间 09:00 与 14:00 各一轮批量归因
    cron: "0 0 9,14 * * ?"
    # 夜间兜底批量：23:30 清零当天漏网与存量未归因数据
    night-cron: "0 30 23 * * ?"
    # 单轮扫描投递的待归因反馈上限
    batch-size: 200
    surge-threshold: 5
    surge-cooldown-hours: 12
    confidence-threshold: 0.7

# Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 日志
logging:
  level:
    com.voc.insight: info
