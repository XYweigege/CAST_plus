server:
  port: 3001

spring:
  application:
    name: insight-server

  datasource:
    url: jdbc:mysql://localhost:3307/voc_insight?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
  mapper-locations: classpath*:/mapper/**/*.xml

# 业务配置
voc:
  openrouter:
    base-url: https://openrouter.ai/api/v1
    api-key: ${OPENROUTER_API_KEY:}
    model: ${AI_MODEL:deepseek/deepseek-v3.2}
  notify-email: ${NOTIFY_EMAIL:}
  insight:
    # Spring @Scheduled cron 为 6 位（含秒）：每 30 分钟执行
    cron: "0 */30 * * * ?"
    batch-size: 12
    surge-threshold: 5
    surge-cooldown-hours: 12
    confidence-threshold: 0.7

# Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 日志
logging:
  level:
    com.voc.insight: info
