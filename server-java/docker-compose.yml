version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: voc-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: voc_insight
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - voc-mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    container_name: voc-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - voc-redis-data:/data
    command: redis-server --appendonly yes

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: voc-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      TZ: Asia/Shanghai
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # 管理控制台 http://localhost:15672 (guest/guest)
    volumes:
      - voc-rabbitmq-data:/var/lib/rabbitmq

volumes:
  voc-mysql-data:
  voc-redis-data:
  voc-rabbitmq-data:
